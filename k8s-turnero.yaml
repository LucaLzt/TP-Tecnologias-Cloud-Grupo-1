apiVersion: v1
kind: ConfigMap
metadata:
  name: turnero-config
data:
  DATA_SOURCE: "postgres"
  DATABASE_URL: "postgresql://turnero:turnero123@db-service:5432/turnero"
  PGSSL: "false"
  PORT: "3000"
  HOST: "0.0.0.0"
  SERVICE_MODEL: "contenedores-k3s"
  INSTANCE_NAME: "pod-k3s"
  REGION: "local"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:16.6-alpine
          env:
            - name: POSTGRES_USER
              value: "turnero"
            - name: POSTGRES_PASSWORD
              value: "turnero123"
            - name: POSTGRES_DB
              value: "turnero"
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
spec:
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: turnero-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: turnero
  template:
    metadata:
      labels:
        app: turnero
    spec:
      containers:
        - name: app
          image: ghcr.io/lucalzt/tp-tecnologias-cloud-grupo-1:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: turnero-config
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: turnero-service
spec:
  type: NodePort
  selector:
    app: turnero
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080