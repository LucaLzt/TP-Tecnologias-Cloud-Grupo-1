name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.14.0'

jobs:
  calidad:
    name: Pruebas y análisis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas automáticas
        run: npm test

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Buscar secretos en el historial completo
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  imagen:
    name: Construir y escanear la imagen
    runs-on: ubuntu-latest
    needs: calidad
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en el registro de GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: turnero:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Escanear la imagen en busca de vulnerabilidades
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: turnero:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

  despliegue-faas:
    name: Desplegar en Cloudflare Workers (FaaS)
    runs-on: ubuntu-latest
    needs: calidad
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Desplegar Worker con Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  despliegue-paas:
    name: Desplegar en Render (PaaS)
    runs-on: ubuntu-latest
    needs: calidad
    if: github.ref == 'refs/heads/plataformaComoServicio'
    steps:
      - name: Despliegue automático en Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
